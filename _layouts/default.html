<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.permalink == '/' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
{% if site.preview %}<meta name="robots" content="noindex,nofollow">{% endif %}
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
{% if site.preview %}<div class="preview-bar">PREVIEW · not live yet. Run "Publish site" on GitHub to make it live.</div>{% endif %}
<header><a href="{{ '/' | relative_url }}">Un Momento</a><nav><a href="{{ '/support/' | relative_url }}">Support</a><a href="{{ '/privacy/' | relative_url }}">Privacy</a></nav></header>
<main>
{{ content }}
</main>
<footer>© {{ 'now' | date: '%Y' }} {{ site.data.settings.company }} · <a href="{{ '/privacy/' | relative_url }}">Privacy</a> · <a href="{{ '/support/' | relative_url }}">Support</a></footer>
</body>
</html>
